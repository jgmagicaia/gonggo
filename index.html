<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>공고현황</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1d1f23;--sub:#5b6170;--line:#cfd3da;--btn:#2563eb;--bad:#d33}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--card:#1d1f23;--fg:#eceef2;--sub:#a9afbb;--line:#3a3d44;--btn:#3b82f6;--bad:#f87171}}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
form{background:var(--card);padding:28px 22px;border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,.08);width:100%;max-width:340px;box-sizing:border-box}
h1{font-size:19px;margin:0 0 6px}p{margin:0 0 18px;color:var(--sub);font-size:14px}
input[type=password]{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:8px;box-sizing:border-box;background:var(--bg);color:var(--fg)}
label{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:var(--sub)}
button{margin-top:16px;width:100%;padding:13px;font-size:16px;font-weight:600;border:0;border-radius:8px;background:var(--btn);color:#fff;cursor:pointer}
#msg{min-height:20px;margin-top:12px;font-size:14px;color:var(--bad)}
</style></head><body>
<form id="f"><h1>공고현황</h1><p>비밀번호를 넣으면 열립니다.</p>

<label><input type="checkbox" id="keep" checked> 이 기기에서 기억하기</label>
<button type="submit">열기</button><div id="msg"></div></form>

var KEY='gonggo_'+D.s;
function u8(x){var s=atob(x),a=new Uint8Array(s.length);for(var k=0;k<s.length;k++)a[k]=s.charCodeAt(k);return a}
function b64(a){var s='';for(var k=0;k<a.length;k++)s+=String.fromCharCode(a[k]);return btoa(s)}
async function derive(pw){var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},k,512))}
async function unlock(km){var iv=u8(D.i),ct=u8(D.c),both=new Uint8Array(iv.length+ct.length);both.set(iv);both.set(ct,iv.length);
 var mk=await crypto.subtle.importKey('raw',km.slice(32,64),{name:'HMAC',hash:'SHA-256'},false,['verify']);
 if(!(await crypto.subtle.verify('HMAC',mk,u8(D.t),both)))return null;
 var ek=await crypto.subtle.importKey('raw',km.slice(0,32),{name:'AES-CBC'},false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:iv},ek,ct))}
function show(h){var go=function(){document.open();document.write(h);document.close()};
 if(document.readyState==='complete')go();else window.addEventListener('load',go)}
if(location.hash==='#forget'){try{localStorage.removeItem(KEY)}catch(e){}}
(async function(){var sk=null;try{sk=localStorage.getItem(KEY)}catch(e){}
 if(sk){try{var h=await unlock(u8(sk));if(h){show(h);return}}catch(e){}try{localStorage.removeItem(KEY)}catch(e){}}
 document.getElementById('pw').focus()})();
document.getElementById('f').addEventListener('submit',async function(ev){ev.preventDefault();var m=document.getElementById('msg');
 if(!window.crypto||!crypto.subtle){m.textContent='이 브라우저에서는 열 수 없습니다.';return}
 m.style.color='var(--sub)';m.textContent='여는 중…';
 try{var km=await derive(document.getElementById('pw').value);var h=await unlock(km);
  if(!h){m.style.color='';m.textContent='비밀번호가 맞지 않습니다.';return}
  if(document.getElementById('keep').checked){try{localStorage.setItem(KEY,b64(km))}catch(e){}}
  show(h)}catch(e){m.style.color='';m.textContent='열지 못했습니다: '+e.message}});
